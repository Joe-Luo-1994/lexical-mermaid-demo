name: Evidence checks
on:
  pull_request:
  push:
    branches: [main, "feat/editor-*"]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:rules
      - run: npm run validate
      - run: npm run build
      - run: npm run test:browser
      - run: npm --prefix docs/integrations ci --ignore-scripts
      - run: npm --prefix docs/integrations test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: results/
          retention-days: 7
