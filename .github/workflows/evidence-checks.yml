name: Evidence checks
on:
  pull_request:
  push:
    branches: [main, "feat/editor-*"]
jobs:
  renderer-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/renderer-comparison
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: experiments/renderer-comparison/package-lock.json
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-comparison-evidence
          path: experiments/renderer-comparison/results/
          retention-days: 7
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:debug
      - run: npm run test:debug:browser
      - run: npm run test:rules
      - run: npm run validate
      - run: npm run build
      - run: npm run test:browser
      - run: npm --prefix docs/integrations ci --ignore-scripts
      - run: npm --prefix docs/integrations test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            results/
            !results/debug-runtime/**/project
            !results/debug-runtime/**/project/**
          # Case seals/source snapshots live in .core; target dependency links do not belong in evidence.
          include-hidden-files: true
          retention-days: 7
